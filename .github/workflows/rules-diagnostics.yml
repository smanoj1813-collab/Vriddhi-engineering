# Rules-suite diagnostics harness.
#
# Temporary, branch-scoped twin of `rules-nightly.yml`: it runs the FULL rules
# suite on pushes to an `arena/*` branch and attaches the failing test names +
# assertion text to the check run as annotations. It exists so that a session
# working on a branch can see *why* the suite is red without a human having to
# open the (private-repo, log-host-restricted) job log. Delete this file once
# the branch it was added for is merged.
name: Rules diagnostics

on:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/rules-diagnostics.yml'
      - 'firestore.rules'
      - 'storage.rules'
      - 'functions/test/firestore.rules.test.ts'
      - 'functions/package.json'
      - 'functions/package-lock.json'
  workflow_dispatch:

jobs:
  rules:
    name: Full rules suite (diagnostics)
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Full Firestore rules suite
        working-directory: functions
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee ../rules-suite.log

      - name: Attach failure details to the check run
        if: failure()
        run: node scripts/github-test-annotations.cjs rules-suite.log

      - name: Upload the rules suite log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rules-suite-log
          path: rules-suite.log
          retention-days: 14
          if-no-files-found: ignore
