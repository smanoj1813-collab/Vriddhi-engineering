# Continuous Integration pipeline for Vriddhi.
# This runs automatically on every push to `main` and on every pull request.
# It only BUILDS the code to catch errors early — it never deploys anything.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job 1: build the frontend (React + Vite + TypeScript)
  frontend:
    name: Frontend build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The runner image ships with Android SDK, .NET, Haskell, Swift and
      # CodeQL preinstalled — none of which a Vite/React project needs. On a
      # large install (852 packages) that leftover bulk has been enough to push
      # the runner into reclaiming its own files mid-job, which showed up as
      # `ENOENT: Could not read package.json` from npm. Free it first, and
      # report usage before and after so the numbers are on the record.
      - name: Disk before install
        run: df -h /

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Disk after install
        run: |
          df -h /
          du -sh node_modules

      - name: Check for dead code in src/
        run: node scripts/check-dead-code.cjs

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Validate course packs
        run: npm run validate:courses

      - name: Render-check course pages
        run: npm run test:render:courses

      - name: Build the frontend
        run: npm run build

  # Job 2: build the Cloud Functions backend (Express + TypeScript)
  functions:
    name: Functions build (Node 22)
    runs-on: ubuntu-latest
    env:
      # Skip Puppeteer's Chromium download during `npm ci`.
      # It isn't needed to compile TypeScript, and skipping it makes CI faster.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build the functions
        working-directory: functions
        run: npm run build

      - name: Functions unit tests
        working-directory: functions
        run: npm run test:unit

      - name: Course and related Firestore rules tests
        working-directory: functions
        run: npm run test:rules:course-security

  # Job 3: scheme-pack evaluation rules (shared by non-tech and engineering).
  #
  # The scheme engine is pure TypeScript with no runtime dependencies, so this
  # job installs only the TypeScript loader instead of the full dependency
  # tree. It stays fast, and it keeps guarding the numbers that decide whether
  # a student passes, what grade they get and what a question paper looks like
  # even when the frontend install is broken.
  scheme:
    name: Scheme pack rules (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install the TypeScript test loader
        run: |
          mkdir -p .ci-tools
          npm init -y --prefix .ci-tools >/dev/null
          npm i --prefix .ci-tools --no-audit --no-fund tsx

      - name: Scheme engine + engineering rules + permissions
        run: node --import ./.ci-tools/node_modules/tsx/dist/loader.mjs --test src/shared/utils/schemeEngine.test.ts src/shared/utils/engineeringScheme.test.ts src/modules/auth/permissions.test.ts
