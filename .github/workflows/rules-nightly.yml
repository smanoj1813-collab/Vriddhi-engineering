# Nightly: the FULL Firestore rules suite against the Firebase emulators.
#
# Per-PR CI runs only the course-security slice (test:rules:course-security)
# for speed; this job guards everything else the 2,000-line suite covers —
# fees, grades, admissions, office, identity, OBE evidence immutability.
# (audit P1-3: promote to per-PR if runtime allows.)
name: Rules nightly

on:
  schedule:
    # 02:30 UTC == 08:00 IST, before the college day starts.
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  rules:
    name: Full Firestore rules suite (Node 22 + Java 21)
    runs-on: ubuntu-latest
    env:
      # Skip Puppeteer's Chromium download during `npm ci` (not needed here).
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      # The log is tee'd to the repo root so the two steps below can read it
      # regardless of which working directory the suite runs in. `shell: bash`
      # brings pipefail, so the step still fails when the suite does.
      - name: Full Firestore rules suite
        working-directory: functions
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee ../rules-suite.log

      # Job logs on this repo are large, and the reviewer sandbox + the
      # Actions log-blob host cannot reach each other; annotations ride on the
      # check run (readable via the API) and on the failed run page. Failing
      # test names + the assertion text land there on every red nightly.
      - name: Attach failure details to the check run
        if: failure()
        run: node scripts/github-test-annotations.cjs rules-suite.log

      - name: Upload the rules suite log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rules-suite-log
          path: rules-suite.log
          retention-days: 14
          if-no-files-found: ignore
